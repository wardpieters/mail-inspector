name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, sockets, pcntl, redis, pdo_sqlite, pdo_pgsql, curl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php scripts/setup-env.php
      - name: PHP tests
        run: php artisan test
      - name: PHP formatting
        run: |
          vendor/bin/pint --format agent
          git diff --exit-code -- '*.php'

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- --run
      - run: npm run typecheck
      - run: npm run build

  containers:
    name: Containers and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5.12'
          extensions: mbstring, intl, sockets, pcntl, redis, pdo_sqlite, pdo_pgsql, curl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php scripts/setup-env.php
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build PHP application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: mail-inspector-app:local
          cache-from: |
            type=gha,scope=ci-app-amd64
            type=gha,scope=app
          cache-to: type=gha,mode=max,scope=ci-app-amd64
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          tags: mail-inspector-web:local
          cache-from: |
            type=gha,scope=ci-web-amd64
            type=gha,scope=web
          cache-to: type=gha,mode=max,scope=ci-web-amd64
      - name: Build validating resolver image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/unbound
          load: true
          tags: mail-inspector-unbound:local
          cache-from: |
            type=gha,scope=ci-unbound-amd64
            type=gha,scope=unbound
          cache-to: type=gha,mode=max,scope=ci-unbound-amd64
      - name: SMTP, DNSSEC, Redis and PostgreSQL fixtures
        run: docker compose -p mail-ci-fixtures -f compose.test.yaml run --rm --user "$(id -u):$(id -g)" php-test vendor/bin/phpunit tests/Integration
      - name: Migration gating and persistence
        env:
          MAIL_TEST_COMPOSE: 'true'
        run: vendor/bin/phpunit tests/Integration/ComposeLifecycleTest.php
      - name: Fixture logs on failure
        if: failure()
        run: docker compose -p mail-ci-fixtures -f compose.test.yaml logs --no-color --tail=100
      - name: Clean up fixtures
        if: always()
        run: docker compose -p mail-ci-fixtures -f compose.test.yaml down --volumes --remove-orphans
