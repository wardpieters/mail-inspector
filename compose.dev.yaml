services:
  app:
    user: "0:0"
    environment: {APP_ENV: local, APP_DEBUG: "true"}
    volumes: [".:/app", "app_storage:/app/storage"]
  worker:
    user: "0:0"
    environment: {APP_ENV: local, APP_DEBUG: "true"}
    volumes: [".:/app", "app_storage:/app/storage"]
  scheduler:
    user: "0:0"
    environment: {APP_ENV: local, APP_DEBUG: "true"}
    volumes: [".:/app", "app_storage:/app/storage"]
  web:
    volumes: ["./public:/app/public:ro"]
  vite:
    image: node:24-bookworm-slim
    working_dir: /app
    command: [sh, -c, "npm ci && npm run dev -- --host 0.0.0.0"]
    volumes: [".:/app"]
    ports: ["127.0.0.1:5173:5173"]
    networks: [egress]
